[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jtbd-knowledge-skill"
version = "3.2.01"
description = "JTBD (Jobs to Be Done) v3.0 toolkit — Klement/ Ulwick ODI/ Wunker Atlas/ Kalbach four schools integration (完整工具集 - 融合四大学派)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "AliDujie"}]
keywords = ["jobs-to-be-done", "jtbd", "user-research", "opportunity-scoring", "forces-of-progress", "openclaw-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]

[project.urls]
Homepage = "https://github.com/AliDujie/jtbd-knowledge-skill"
Repository = "https://github.com/AliDujie/jtbd-knowledge-skill"
Issues = "https://github.com/AliDujie/jtbd-knowledge-skill/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["jtbd*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
